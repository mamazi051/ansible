---
  - name: Check target OS and DNS
    shell: |
      echo "=== OS ==="
      cat /etc/os-release
      echo "=== DNS ==="
      cat /etc/resolv.conf
      echo "=== RESOLVE ==="
      getent hosts mirrorlist.centos.org
    register: debug_info
    changed_when: false

  - name: Show debug info
    debug:
      var: debug_info.stdout
  - name: install nginx 
    package:
      name: "{{packages}}"
      state: latest
  - name: start and enable Nginx Service
    service:
      name: nginx
      state: started
      enabled: yes
  - name: copy nginx config
    template:
      src: site.conf.j2
      dest: /etc/nginx/conf.d/mysitee.conf
    notify: restart nginx service
  - debug:
      var: ansible_default_ipv4.address
  - debug:
      var: ansible_memtotal_mb
  - debug:
      var: ansible_date_time

# tasks file for roles/nginx

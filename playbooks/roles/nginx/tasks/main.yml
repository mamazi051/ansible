---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install nginx
  apt:
    name: "{{ packages }}"
    state: present

- name: Start and enable Nginx Service
  service:
    name: nginx
    state: stopped
    enabled: no

- name: Copy nginx config
  template:
    src: site.conf.j2
    dest: /etc/nginx/conf.d/mysitee.conf
  notify: restart nginx service
  
